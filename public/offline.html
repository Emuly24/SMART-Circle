<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · SMART Circle</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="minimal">
<main class="minimal__main">
    <div class="card card--narrow">
        <h1>You are offline</h1>
        <p>No internet right now. Lessons and notes you saved for offline still open:</p>
        <ul id="saved" class="timeline"><li class="muted">Nothing saved on this device yet. Next time you are online, open a lesson and tap “Save for offline”.</li></ul>
        <p class="muted">When you are back online, everything else works again.</p>
    </div>
</main>
<script src="/assets/js/offline-page.js" defer></script>
</body>
</html>
